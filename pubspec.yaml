name: opencloud
description: A multi-project Cloud Storage App. Powered By Firebase Free Tier. 


publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.2+1

environment:
  sdk: '>=3.2.3 <4.0.0'


dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  firebase_core: ^5.1.0
  firebase_storage: ^14.0.1
  firebase_auth: ^7.0.1
  provider: ^6.1.1
  shared_preferences: ^2.0.15
  cloud_firestore: ^7.1.0
  file_picker: ^13.3.0
  url_launcher: ^6.1.5
  just_audio: ^0.9.28
  video_player: ^2.4.6
  miniplayer: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/